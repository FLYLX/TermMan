services:

  prestart:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    networks:
      - traefik-public
      - default
    working_dir: /app/backend
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_LOG_DIR=/app/backend/app/services/log
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - ROBOT_PLUGIN_ENABLED=${ROBOT_PLUGIN_ENABLED:-true}
      - ROBOT_BRIDGE_EMBEDDED=${ROBOT_BRIDGE_EMBEDDED:-false}
      - ROBOT_BACKEND_URL=${ROBOT_BACKEND_URL:-http://backend:8000}
      - ROBOT_BRIDGE_URL=${ROBOT_BRIDGE_URL:-http://robot-bridge:7000}
      - ROBOT_CONVERSATION_MEMORY_DIR=${ROBOT_CONVERSATION_MEMORY_DIR:-/app/backend/.runtime/robot_conversation_memory}
      - AGENT_STATE_STORE_PATH=${AGENT_STATE_STORE_PATH:-/app/backend/.runtime/agent_state.db}
      - ROBOT_QQ_IS_SANDBOX=${ROBOT_QQ_IS_SANDBOX:-false}
      - TERMINAL_WS_DEFAULT_HOST=${TERMINAL_WS_DEFAULT_HOST:-0.0.0.0}
      - TERMINAL_WS_DEFAULT_PORT_START=${TERMINAL_WS_DEFAULT_PORT_START:-32000}
      - TERMINAL_WS_DEFAULT_PORT_END=${TERMINAL_WS_DEFAULT_PORT_END:-32111}
      - TERMINAL_WS_DEFAULT_HEARTBEAT_INTERVAL_SECONDS=${TERMINAL_WS_DEFAULT_HEARTBEAT_INTERVAL_SECONDS:-30}
      - LITELLM_LOCAL_MODEL_COST_MAP=${LITELLM_LOCAL_MODEL_COST_MAP:-True}
    volumes:
      - backend-db:/app/backend
      - ./backend/app/services/log:/app/backend/app/services/log
      - ./backend/skills:/app/backend/skills
      - ./backend/knowledge:/app/backend/knowledge
    depends_on:
      daemon:
        condition: service_started

  backend:
    image: '${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    depends_on:
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
      - ENVIRONMENT=${ENVIRONMENT}
      - BACKEND_LOG_DIR=/app/backend/app/services/log
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-}
      - SECRET_KEY=${SECRET_KEY?Variable not set}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD?Variable not set}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - ROBOT_PLUGIN_ENABLED=${ROBOT_PLUGIN_ENABLED:-true}
      - ROBOT_BRIDGE_EMBEDDED=${ROBOT_BRIDGE_EMBEDDED:-false}
      - ROBOT_BACKEND_URL=${ROBOT_BACKEND_URL:-http://backend:8000}
      - ROBOT_BRIDGE_URL=${ROBOT_BRIDGE_URL:-http://robot-bridge:7000}
      - ROBOT_CONVERSATION_MEMORY_DIR=${ROBOT_CONVERSATION_MEMORY_DIR:-/app/backend/.runtime/robot_conversation_memory}
      - AGENT_STATE_STORE_PATH=${AGENT_STATE_STORE_PATH:-/app/backend/.runtime/agent_state.db}
      - ROBOT_QQ_IS_SANDBOX=${ROBOT_QQ_IS_SANDBOX:-false}
      - TERMINAL_WS_DEFAULT_HOST=${TERMINAL_WS_DEFAULT_HOST:-0.0.0.0}
      - TERMINAL_WS_DEFAULT_PORT_START=${TERMINAL_WS_DEFAULT_PORT_START:-32000}
      - TERMINAL_WS_DEFAULT_PORT_END=${TERMINAL_WS_DEFAULT_PORT_END:-32111}
      - TERMINAL_WS_DEFAULT_HEARTBEAT_INTERVAL_SECONDS=${TERMINAL_WS_DEFAULT_HEARTBEAT_INTERVAL_SECONDS:-30}
      - LITELLM_LOCAL_MODEL_COST_MAP=${LITELLM_LOCAL_MODEL_COST_MAP:-True}
      - MALLOC_ARENA_MAX=${MALLOC_ARENA_MAX:-2}
      - DAEMON_HOST_PORT=${DAEMON_HOST_PORT:-39999}
      - DAEMON_PUBLIC_HOST=${DAEMON_PUBLIC_HOST:-}
    ports:
      - "${TERMINAL_WS_HOST_PORT_RANGE:-32000-32111}:${TERMINAL_WS_DEFAULT_PORT_START:-32000}-${TERMINAL_WS_DEFAULT_PORT_END:-32111}"
    volumes:
      - backend-db:/app/backend
      - ./backend/app/services/log:/app/backend/app/services/log
      - ./backend/skills:/app/backend/skills
      - ./backend/knowledge:/app/backend/knowledge

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/utils/health-check/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - USE_CHINA_MIRRORS=${USE_CHINA_MIRRORS:-true}
        - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-small-zh-v1.5}
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-backend.loadbalancer.server.port=8000

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.rule=Host(`api.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.entrypoints=http

      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.rule=Host(`api.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls.certresolver=le

      # Enable redirection for HTTP and HTTPS
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.middlewares=https-redirect

  robot-bridge:
    image: '${DOCKER_IMAGE_ROBOT:-robot}:${TAG-latest}'
    build:
      context: .
      dockerfile: robot/Dockerfile
      args:
        - USE_CHINA_MIRRORS=${USE_CHINA_MIRRORS:-true}
    restart: always
    networks:
      - default
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./robot/.env
    environment:
      - ROBOT_BRIDGE_PUBLIC_URL=${ROBOT_BRIDGE_PUBLIC_URL:-}
    volumes:
      - ./robot:/app/robot

  frontend:
    image: '${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}'
    restart: always
    networks:
      - traefik-public
      - default
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL?Variable not set}
        - NODE_ENV=production
        - USE_CHINA_MIRRORS=${USE_CHINA_MIRRORS:-true}
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public

      - traefik.http.services.${STACK_NAME?Variable not set}-frontend.loadbalancer.server.port=80

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.rule=Host(`dashboard.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.entrypoints=http

      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.rule=Host(`dashboard.${DOMAIN?Variable not set}`)
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.entrypoints=https
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls=true
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls.certresolver=le

      # Enable redirection for HTTP and HTTPS
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.middlewares=https-redirect

  daemon:
    image: '${DOCKER_IMAGE_DAEMON:-termpaws-daemon}:${TAG-latest}'
    build:
      context: ./daemon
      dockerfile: Dockerfile
      args:
        - USE_CHINA_MIRRORS=${USE_CHINA_MIRRORS:-true}
    restart: always
    networks:
      - default
    ports:
      - "${DAEMON_HOST_PORT:-39999}:9000"
      # server port
      - "${DAEMON_SERVER_HOST_PORT:-43906}:43906"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=9000
      - API_KEY=termpaws_daemon_secret_key_2024
      - TERMINAL_SHELL=/bin/sh
      - TERMINAL_ENCODING=utf-8
      - WORKDIR=/app/src/workdir
      - LOG_DIR=/app/log
      - DATA_DIR=/app/src/data
      - BACKEND_URL=${DAEMON_BACKEND_URL:-http://backend:8000}
    volumes:
      - ./daemon/log:/app/log
      - ./daemon/workdir:/app/src/workdir
      - ./daemon/src/data:/app/src/data

volumes:
  backend-db:

networks:
  traefik-public:
    # Allow setting it to false for testing
    external: true
