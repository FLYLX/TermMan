server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;
    add_header Cache-Control "no-cache";
  }

  # index.html is the SPA entry point and must always be revalidated,
  # otherwise browsers keep loading stale bundles after a redeploy.
  # Hashed assets under /assets/ are content-addressed and cache forever.
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
