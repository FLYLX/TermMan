services:

  # Local services are available on their ports, but also available on:
  # http://api.localhost.tiangolo.com: backend
  # http://dashboard.localhost.tiangolo.com: frontend
  # etc. To enable it, update .env, set:
  # DOMAIN=localhost.tiangolo.com
  proxy:
    profiles:
      - proxy
    image: traefik:3.6
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${TRAEFIK_HTTP_HOST_PORT:-20080}:80"
      - "${TRAEFIK_DASHBOARD_HOST_PORT:-20081}:8080"
    # Duplicate the command from compose.yml to add --api.insecure=true
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Add a constraint to only use services with the label for this stack
      - --providers.docker.constraints=Label(`traefik.constraint-label`, `traefik-public`)
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Create an entrypoint "https" listening on port 443
      - --entrypoints.https.address=:443
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log
      # Enable debug logging for local development
      - --log.level=DEBUG
      # Enable the Dashboard and API
      - --api
      # Enable the Dashboard and API in insecure mode for local development
      - --api.insecure=true
    labels:
      # Enable Traefik for this service, to make it available in the public network
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      # Dummy https-redirect middleware that doesn't really redirect, only to
      # allow running it locally
      - traefik.http.middlewares.https-redirect.contenttype.autodetect=false
    networks:
      - traefik-public
      - default



  prestart:
    volumes:
      - ./backend:/app/backend

  backend:
    restart: "no"
    ports:
      - "${BACKEND_HOST_PORT:-28888}:8000"
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - USE_CHINA_MIRRORS=${USE_CHINA_MIRRORS:-true}
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command:
      - bash
      - scripts/run_backend.sh
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - app
      - --reload-include
      - "*.py"
      - --reload-exclude
      - "app/services/log/*"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - ./backend/.venv
            - ./backend/sql_app.db
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    # TODO: remove once coverage is done locally
    volumes:
      - ./backend:/app/backend
      - ./backend/htmlcov:/app/backend/htmlcov
      - ./backend/skills:/app/backend/skills
      - ./backend/knowledge:/app/backend/knowledge
    environment:
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_TLS: "${SMTP_TLS:-false}"
      EMAILS_FROM_EMAIL: "${EMAILS_FROM_EMAIL:-noreply@example.com}"
      BACKEND_LOG_DIR: "/app/backend/app/services/log"
      ROBOT_PLUGIN_ENABLED: "${ROBOT_PLUGIN_ENABLED:-true}"
      ROBOT_BRIDGE_EMBEDDED: "${ROBOT_BRIDGE_EMBEDDED:-false}"
      ROBOT_BACKEND_URL: "${ROBOT_BACKEND_URL:-http://backend:8000}"
      ROBOT_BRIDGE_URL: "${ROBOT_BRIDGE_URL:-http://robot-bridge:7000}"
      ROBOT_CONVERSATION_MEMORY_DIR: "${ROBOT_CONVERSATION_MEMORY_DIR:-/app/backend/.runtime/robot_conversation_memory}"
      TERMINAL_WS_DEFAULT_HOST: "${TERMINAL_WS_DEFAULT_HOST:-0.0.0.0}"
      TERMINAL_WS_DEFAULT_PORT_START: "${TERMINAL_WS_DEFAULT_PORT_START:-32000}"
      TERMINAL_WS_DEFAULT_PORT_END: "${TERMINAL_WS_DEFAULT_PORT_END:-32111}"
      TERMINAL_WS_DEFAULT_HEARTBEAT_INTERVAL_SECONDS: "${TERMINAL_WS_DEFAULT_HEARTBEAT_INTERVAL_SECONDS:-30}"
      LITELLM_LOCAL_MODEL_COST_MAP: "${LITELLM_LOCAL_MODEL_COST_MAP:-True}"

  robot-bridge:
    restart: unless-stopped
    build:
      context: .
      dockerfile: robot/Dockerfile
      args:
        - USE_CHINA_MIRRORS=${USE_CHINA_MIRRORS:-true}
    ports:
      - "${ROBOT_BRIDGE_HOST_PORT:-33333}:7000"
    environment:
      ROBOT_BRIDGE_PUBLIC_URL: "${ROBOT_BRIDGE_PUBLIC_URL:-}"
    develop:
      watch:
        - path: ./robot
          action: sync
          target: /app/robot
          ignore:
            - ./robot/.venv
        - path: ./robot/pyproject.toml
          action: rebuild

  mailcatcher:
    profiles:
      - mail
      - test
    image: schickling/mailcatcher
    ports:
      - "${MAILCATCHER_WEB_HOST_PORT:-20108}:1080"
      - "${MAILCATCHER_SMTP_HOST_PORT:-20125}:1025"

  frontend:
    restart: "no"
    ports:
      - "${FRONTEND_HOST_PORT:-27777}:80"
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL?Variable not set}
        - NODE_ENV=development
        - USE_CHINA_MIRRORS=${USE_CHINA_MIRRORS:-true}

  playwright:
    profiles:
      - test
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        - VITE_API_URL=${PLAYWRIGHT_VITE_API_URL:-http://backend:8000}
        - NODE_ENV=production
        - USE_CHINA_MIRRORS=${USE_CHINA_MIRRORS:-true}
    ipc: host
    depends_on:
      - backend
      - mailcatcher
    env_file:
      - .env
    environment:
      - VITE_API_URL=${PLAYWRIGHT_VITE_API_URL:-http://backend:8000}
      - MAILCATCHER_HOST=${PLAYWRIGHT_MAILCATCHER_HOST:-http://mailcatcher:1080}
      # For the reports when run locally
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI:-}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results
    ports:
      - ${PLAYWRIGHT_REPORT_HOST_PORT:-20923}:9323

  daemon:
    restart: "no"
    develop:
      watch:
        - path: ./daemon/src
          action: sync
          target: /app/src
        - path: ./daemon/pyproject.toml
          action: rebuild

networks:
  traefik-public:
    # For local dev, don't expect an external Traefik network
    external: false
