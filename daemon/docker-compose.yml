version: '3.8'

services:
  termpaws-daemon:
    build: .
    container_name: termpaws-daemon
    ports:
      - "9000:9000"
      # server port
      - "43906:43906"
    volumes:
      - ./src:/app/src
      - ./workdir:/app/src/workdir
      - ./log:/app/log
    environment:
      - HOST=0.0.0.0
      - PORT=9000
      - API_KEY=TermPaws_daemon_secret_key_2024
      - WORKDIR=/app/src/workdir
      - LOG_DIR=/app/log
      - DATA_DIR=/app/src/data
    restart: unless-stopped
    networks:
      - termpaws-network

networks:
  termpaws-network:
    driver: bridge
