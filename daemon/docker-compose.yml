version: '3.8'

services:
  termman-daemon:
    build: .
    container_name: termman-daemon
    ports:
      - "9000:9000"
    volumes:
      - ./src:/app/src
      - ./workdir:/app/src/workdir
      - ./log:/app/log
    environment:
      - HOST=0.0.0.0
      - PORT=9000
      - API_KEY=termman_daemon_secret_key_2024
      - WORKDIR=/app/src/workdir
      - LOG_DIR=/app/log
      - DATA_DIR=/app/src/data
    restart: unless-stopped
    networks:
      - termman-network

networks:
  termman-network:
    driver: bridge
